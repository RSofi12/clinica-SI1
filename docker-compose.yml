services:
  # Database Service (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: clinica_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-clinica_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DOCKER_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - clinica-network

  # Backend Service (PHP 8.3 FPM / Laravel)
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: clinica_backend
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      - postgres
    networks:
      - clinica-network

  # Web Server Service (Nginx Reverse Proxy for PHP-FPM)
  web:
    image: nginx:alpine
    container_name: clinica_nginx
    restart: unless-stopped
    ports:
      - "${DOCKER_WEB_PORT:-8000}:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - clinica-network

  # Frontend Service (React + Vite SPA)
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: clinica_frontend
    restart: unless-stopped
    ports:
      - "${DOCKER_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - clinica-network

volumes:
  pgdata:
    driver: local

networks:
  clinica-network:
    driver: bridge
